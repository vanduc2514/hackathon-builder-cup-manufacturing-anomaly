<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 170" role="img" aria-label="Gemini multimodal reasoning returning structured JSON"><style>
:root, svg {
  --ink: #0b1220;
  --ink-2: #1e2638;
  --text: #334155;
  --muted: #64748b;
  --faint: #94a3b8;
  --hair: rgba(15, 23, 42, .07);
  --hair-strong: rgba(15, 23, 42, .14);
  --accent: #5b5bf0;
  --accent-2: #7c6cff;
  --accent-soft: rgba(91, 91, 240, .1);
  --accent-ring: rgba(91, 91, 240, .28);
  --danger: #e5484d;
  --danger-soft: rgba(229, 72, 77, .12);
  --warning: #f5a524;
  --warning-soft: rgba(245, 165, 36, .14);
  --success: #12a150;
  --success-soft: rgba(18, 161, 80, .12);
  --info: #3b82f6;
  --info-soft: rgba(59, 130, 246, .12);
  --font-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}
@keyframes pvScan { 0% { transform: translateY(0); } 100% { transform: translateY(140px); } }
@keyframes pvPacket { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: .9; } 90% { opacity: .9; } 100% { transform: translateX(200px); opacity: 0; } }
@keyframes pvPacketShort { 0% { transform: translateX(0); opacity: 0; } 15% { opacity: .9; } 85% { opacity: .9; } 100% { transform: translateX(118px); opacity: 0; } }
@keyframes pvBlink { 50% { opacity: .25; } }
@keyframes pvBreathe { 50% { opacity: .55; } }
@keyframes pvFlow { to { stroke-dashoffset: -20; } }
.pv-scan { animation: pvScan 3.2s ease-in-out infinite alternate; }
.pv-packet { animation: pvPacket 4.4s linear infinite; }
.pv-packet-short { animation-name: pvPacketShort; animation-duration: 3.6s; }
.pv-blink { animation: pvBlink 2s ease-in-out infinite; }
.pv-breathe { animation: pvBreathe 2.8s ease-in-out infinite; }
.pv-flow { animation: pvFlow 1.6s linear infinite; }
@media (prefers-reduced-motion: reduce) {
  .pv-scan, .pv-packet, .pv-blink, .pv-breathe, .pv-flow { animation: none; }
  .pv-packet { opacity: .9; }
}
</style><defs><marker id="pv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker></defs>
      <rect x="8" y="14" width="112" height="38" rx="8" fill="#fff" stroke="var(--hair-strong)" stroke-width="1"/><text x="64" y="38" font-size="11" fill="var(--ink)" text-anchor="middle" font-weight="600" font-family="var(--font-main)">Photo</text><path d="M120 33 C160 33 160 83 196 83" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#pv-arrow)"/><rect x="8" y="64" width="112" height="38" rx="8" fill="#fff" stroke="var(--hair-strong)" stroke-width="1"/><text x="64" y="88" font-size="11" fill="var(--ink)" text-anchor="middle" font-weight="600" font-family="var(--font-main)">Voice</text><path d="M120 83 C160 83 160 83 196 83" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#pv-arrow)"/><rect x="8" y="114" width="112" height="38" rx="8" fill="#fff" stroke="var(--hair-strong)" stroke-width="1"/><text x="64" y="138" font-size="11" fill="var(--ink)" text-anchor="middle" font-weight="600" font-family="var(--font-main)">Telemetry</text><path d="M120 133 C160 133 160 83 196 83" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#pv-arrow)"/>
      <circle cx="240" cy="83" r="42" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6"/>
      <path d="M240 58 C243 76 247 80 265 83 C247 86 243 90 240 108 C237 90 233 86 215 83 C233 80 237 76 240 58 Z" fill="var(--accent)" class="pv-breathe"/>
      <path d="M282 83 L318 83" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#pv-arrow)"/>
      <rect x="320" y="22" width="192" height="124" rx="8" fill="#f8fafd" stroke="var(--hair-strong)" stroke-width="1"/>
      <text x="334" y="44" font-size="11" fill="var(--ink)" font-family="var(--font-mono)">{</text>
      <text x="346" y="64" font-size="10.5" fill="var(--text)" font-family="var(--font-mono)">"root_cause": "T07 wear",</text>
      <text x="346" y="84" font-size="10.5" fill="var(--accent)" font-weight="700" font-family="var(--font-mono)">"confidence": 0.89,</text>
      <text x="346" y="104" font-size="10.5" fill="var(--text)" font-family="var(--font-mono)">"next": "replace insert"</text>
      <text x="334" y="124" font-size="11" fill="var(--ink)" font-family="var(--font-mono)">}</text>
      <text x="240" y="148" font-size="10.5" fill="var(--muted)" text-anchor="middle" font-family="var(--font-main)">multimodal reasoning</text></svg>
