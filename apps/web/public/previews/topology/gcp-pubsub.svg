      <rect class="pv-packet" style="animation-delay:0.0s" x="150" y="80" width="22" height="14" rx="4" fill="var(--accent)" opacity=".9"/><rect class="pv-packet" style="animation-delay:-1.1s" x="150" y="80" width="22" height="14" rx="4" fill="var(--danger)" opacity=".9"/><rect class="pv-packet" style="animation-delay:-2.2s" x="150" y="80" width="22" height="14" rx="4" fill="var(--accent)" opacity=".9"/><rect class="pv-packet" style="animation-delay:-3.3000000000000003s" x="150" y="80" width="22" height="14" rx="4" fill="var(--accent)" opacity=".9"/>
