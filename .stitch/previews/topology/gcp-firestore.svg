<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 176" role="img" aria-label="Firestore blackboard document tree with reactive multi-agent writes"><style>
:root, svg {
  --ink: #0b1220;
  --ink-2: #1e2638;
  --text: #334155;
  --muted: #64748b;
  --faint: #94a3b8;
  --hair: rgba(15, 23, 42, .07);
  --hair-strong: rgba(15, 23, 42, .14);
  --accent: #5b5bf0;
  --accent-2: #7c6cff;
  --accent-soft: rgba(91, 91, 240, .1);
  --accent-ring: rgba(91, 91, 240, .28);
  --danger: #e5484d;
  --danger-soft: rgba(229, 72, 77, .12);
  --warning: #f5a524;
  --warning-soft: rgba(245, 165, 36, .14);
  --success: #12a150;
  --success-soft: rgba(18, 161, 80, .12);
  --info: #3b82f6;
  --info-soft: rgba(59, 130, 246, .12);
  --font-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}
@keyframes pvScan { 0% { transform: translateY(0); } 100% { transform: translateY(140px); } }
@keyframes pvPacket { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: .9; } 90% { opacity: .9; } 100% { transform: translateX(200px); opacity: 0; } }
@keyframes pvPacketShort { 0% { transform: translateX(0); opacity: 0; } 15% { opacity: .9; } 85% { opacity: .9; } 100% { transform: translateX(118px); opacity: 0; } }
@keyframes pvBlink { 50% { opacity: .25; } }
@keyframes pvBreathe { 50% { opacity: .55; } }
@keyframes pvFlow { to { stroke-dashoffset: -20; } }
.pv-scan { animation: pvScan 3.2s ease-in-out infinite alternate; }
.pv-packet { animation: pvPacket 4.4s linear infinite; }
.pv-packet-short { animation-name: pvPacketShort; animation-duration: 3.6s; }
.pv-blink { animation: pvBlink 2s ease-in-out infinite; }
.pv-breathe { animation: pvBreathe 2.8s ease-in-out infinite; }
.pv-flow { animation: pvFlow 1.6s linear infinite; }
@media (prefers-reduced-motion: reduce) {
  .pv-scan, .pv-packet, .pv-blink, .pv-breathe, .pv-flow { animation: none; }
  .pv-packet { opacity: .9; }
}
</style><defs><marker id="pv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker></defs>
      <rect x="10" y="14" width="120" height="34" rx="8" fill="#eef1f8" stroke="var(--hair-strong)" stroke-width="1"/><text x="70" y="36" font-size="11" fill="var(--ink)" text-anchor="middle" font-weight="600" font-family="var(--font-mono)">incidents/</text>
      <path d="M30 48 L30 76 L46 76" fill="none" stroke="var(--faint)" stroke-width="1.4"/>
      <rect x="46" y="60" width="150" height="34" rx="8" fill="#fff" stroke="var(--accent)" stroke-width="1.6"/><text x="121" y="82" font-size="11" fill="var(--ink)" text-anchor="middle" font-weight="700" font-family="var(--font-mono)">INC-2026-B42</text>
      <path d="M64 94 L64 160 M64 116 L80 116 M64 138 L80 138 M64 160 L80 160" fill="none" stroke="var(--faint)" stroke-width="1.4"/>
      <text x="86" y="120" font-size="10.5" fill="var(--accent)" font-weight="700" font-family="var(--font-mono)">state: investigating</text>
      <text x="86" y="142" font-size="10.5" fill="var(--text)" font-family="var(--font-mono)">findings[ ]: 4 drafts</text>
      <text x="86" y="164" font-size="10.5" fill="var(--text)" font-family="var(--font-mono)">version: 4</text>
      <rect x="400" y="14" width="104" height="30" rx="8" fill="#fff" stroke="var(--hair-strong)" stroke-width="1"/><text x="452" y="34" font-size="11" fill="var(--ink)" text-anchor="middle" font-weight="600" font-family="var(--font-main)">QA</text><path d="M400 29 C320 29 280 77 200 77" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#pv-arrow)" stroke-dasharray="4 4" class="pv-flow"/><rect x="400" y="52" width="104" height="30" rx="8" fill="#fff" stroke="var(--hair-strong)" stroke-width="1"/><text x="452" y="72" font-size="11" fill="var(--ink)" text-anchor="middle" font-weight="600" font-family="var(--font-main)">TRA</text><path d="M400 67 C320 67 280 77 200 77" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#pv-arrow)" stroke-dasharray="4 4" class="pv-flow"/><rect x="400" y="90" width="104" height="30" rx="8" fill="#fff" stroke="var(--hair-strong)" stroke-width="1"/><text x="452" y="110" font-size="11" fill="var(--ink)" text-anchor="middle" font-weight="600" font-family="var(--font-main)">PA</text><path d="M400 105 C320 105 280 77 200 77" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#pv-arrow)" stroke-dasharray="4 4" class="pv-flow"/><rect x="400" y="128" width="104" height="30" rx="8" fill="#fff" stroke="var(--hair-strong)" stroke-width="1"/><text x="452" y="148" font-size="11" fill="var(--ink)" text-anchor="middle" font-weight="600" font-family="var(--font-main)">RCA</text><path d="M400 143 C320 143 280 77 200 77" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#pv-arrow)" stroke-dasharray="4 4" class="pv-flow"/>
      <text x="300" y="170" font-size="10.5" fill="var(--muted)" text-anchor="middle" font-family="var(--font-main)">workflow nodes write · SSE pushes to UI</text></svg>
