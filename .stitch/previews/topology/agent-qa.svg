<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" role="img" aria-label="p-chart: defect rate crosses the 3% upper control limit"><style>
:root, svg {
  --ink: #0b1220;
  --ink-2: #1e2638;
  --text: #334155;
  --muted: #64748b;
  --faint: #94a3b8;
  --hair: rgba(15, 23, 42, .07);
