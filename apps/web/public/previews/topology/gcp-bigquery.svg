<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 186" role="img" aria-label="BigQuery partitioned table with suspect lot rows highlighted"><style>
:root, svg {
  --ink: #0b1220;
  --ink-2: #1e2638;
  --text: #334155;
  --muted: #64748b;
  --faint: #94a3b8;
  --hair: rgba(15, 23, 42, .07);
  --hair-strong: rgba(15, 23, 42, .14);
  --accent: #5b5bf0;
  --accent-2: #7c6cff;
  --accent-soft: rgba(91, 91, 240, .1);
  --accent-ring: rgba(91, 91, 240, .28);
  --danger: #e5484d;
  --danger-soft: rgba(229, 72, 77, .12);
  --warning: #f5a524;
  --warning-soft: rgba(245, 165, 36, .14);
  --success: #12a150;
  --success-soft: rgba(18, 161, 80, .12);
  --info: #3b82f6;
