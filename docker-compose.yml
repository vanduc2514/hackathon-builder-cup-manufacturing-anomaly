# Docker Compose configuration for Kaizen Agent local development:
# - bigquery-emulator (goccy/bigquery-emulator) on port 9050
# - backend FastAPI agent service on port 8000
# - web: Plant Ops dashboard (React+Vite) on port 3000
# - mobile: technician app (React+Vite) on port 3001

services:
  bigquery-emulator:
    image: ghcr.io/goccy/bigquery-emulator:latest
    container_name: kaizen-bigquery-emulator
    ports:
      - "9050:9050"
    command:
      - "--project=kaizen-local"
      - "--dataset=manufacturing"
      - "--port=9050"
    restart: unless-stopped

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: kaizen-pubsub-emulator
    ports:
      - "8085:8085"
    entrypoint: ["gcloud", "beta", "emulators", "pubsub"]
    command: ["start", "--host-port=0.0.0.0:8085", "--project=kaizen-local"]
    restart: unless-stopped

  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: kaizen-firestore-emulator
    ports:
      - "8080:8080"
    command:
      - "gcloud"
      - "beta"
      - "emulators"
      - "firestore"
      - "start"
      - "--host-port=0.0.0.0:8080"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY backend/requirements.txt requirements.txt
        RUN pip install --no-cache-dir -r requirements.txt
        COPY backend/ backend/
        COPY data/ data/
        COPY simulator/ simulator/
        CMD ["uvicorn", "backend.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    container_name: kaizen-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - GCP_PROJECT_ID=kaizen-local
      - BIGQUERY_EMULATOR_HOST=http://bigquery-emulator:9050
      - BIGQUERY_DATASET=manufacturing
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8080
      - AUTH_USERS
      - AUTH_SECRET
    depends_on:
      - bigquery-emulator
      - pubsub-emulator
      - firestore-emulator

  web:
    build:
      context: ./apps/web
      dockerfile_inline: |
        FROM node:22-alpine
        WORKDIR /app
        COPY package.json tsconfig.json tsconfig.node.json vite.config.ts index.html ./
        COPY src/ src/
        COPY public/ public/
        RUN npm install
        CMD ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    container_name: kaizen-web
    ports:
      - "3000:3000"
    environment:
      - API_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend

  mobile:
    build:
      context: ./apps/mobile
      dockerfile_inline: |
        FROM node:22-alpine
        WORKDIR /app
        COPY package.json tsconfig.json tsconfig.node.json vite.config.ts index.html ./
        COPY src/ src/
        COPY public/ public/
        RUN npm install
        CMD ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3001"]
    container_name: kaizen-mobile
    ports:
      - "3001:3001"
    environment:
      - API_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend

  factory-simulator:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY backend/requirements.txt requirements.txt
        RUN pip install --no-cache-dir -r requirements.txt
        COPY simulator/ simulator/
        CMD ["python", "-m", "simulator.main"]
    container_name: kaizen-factory-simulator
    environment:
      - MQTT_BROKER_HOST=broker.emqx.io
      - MQTT_BROKER_PORT=1883
      - SIMULATOR_TICK_SEC=2.0
      - SIMULATOR_SPEED=1.0
    restart: unless-stopped
