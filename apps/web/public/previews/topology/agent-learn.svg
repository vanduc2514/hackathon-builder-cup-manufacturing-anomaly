<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" role="img" aria-label="Knowledge base updated from SOP v4 to v5 with ESG savings"><style>
:root, svg {
  --ink: #0b1220;
  --ink-2: #1e2638;
  --text: #334155;
  --muted: #64748b;
  --faint: #94a3b8;
  --hair: rgba(15, 23, 42, .07);
  --hair-strong: rgba(15, 23, 42, .14);
  --accent: #5b5bf0;
  --accent-2: #7c6cff;
  --accent-soft: rgba(91, 91, 240, .1);
  --accent-ring: rgba(91, 91, 240, .28);
  --danger: #e5484d;
  --danger-soft: rgba(229, 72, 77, .12);
  --warning: #f5a524;
  --warning-soft: rgba(245, 165, 36, .14);
  --success: #12a150;
  --success-soft: rgba(18, 161, 80, .12);
  --info: #3b82f6;
  --info-soft: rgba(59, 130, 246, .12);
  --font-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}
@keyframes pvScan { 0% { transform: translateY(0); } 100% { transform: translateY(140px); } }
@keyframes pvPacket { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: .9; } 90% { opacity: .9; } 100% { transform: translateX(200px); opacity: 0; } }
@keyframes pvPacketShort { 0% { transform: translateX(0); opacity: 0; } 15% { opacity: .9; } 85% { opacity: .9; } 100% { transform: translateX(118px); opacity: 0; } }
@keyframes pvBlink { 50% { opacity: .25; } }
@keyframes pvBreathe { 50% { opacity: .55; } }
@keyframes pvFlow { to { stroke-dashoffset: -20; } }
.pv-scan { animation: pvScan 3.2s ease-in-out infinite alternate; }
.pv-packet { animation: pvPacket 4.4s linear infinite; }
.pv-packet-short { animation-name: pvPacketShort; animation-duration: 3.6s; }
.pv-blink { animation: pvBlink 2s ease-in-out infinite; }
.pv-breathe { animation: pvBreathe 2.8s ease-in-out infinite; }
.pv-flow { animation: pvFlow 1.6s linear infinite; }
@media (prefers-reduced-motion: reduce) {
  .pv-scan, .pv-packet, .pv-blink, .pv-breathe, .pv-flow { animation: none; }
  .pv-packet { opacity: .9; }
}
</style><defs><marker id="pv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker></defs>
      <rect x="8" y="40" width="96" height="40" rx="8" fill="#fff" stroke="var(--hair-strong)" stroke-width="1"/><text x="56" y="64" font-size="11" fill="var(--muted)" text-anchor="middle" font-family="var(--font-mono)">SOP v4</text>
      <path d="M104 60 L140 60" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#pv-arrow)"/>
      <rect x="142" y="40" width="110" height="40" rx="8" fill="var(--success-soft)" stroke="var(--success)" stroke-width="1.6"/><text x="197" y="64" font-size="11" fill="#0e8a43" text-anchor="middle" font-weight="700" font-family="var(--font-mono)">SOP v5 + 8D</text>
      <text x="130" y="108" font-size="9.5" fill="var(--muted)" text-anchor="middle" font-family="var(--font-mono)">vector commit VEC-SOP-CNC-T07-v5</text>
      <text x="130" y="126" font-size="10.5" fill="var(--muted)" text-anchor="middle" font-family="var(--font-main)">next incident starts smarter</text>
      <text x="280" y="34" font-size="10.5" fill="var(--muted)" font-family="var(--font-main)">Scrap avoided</text><rect x="280" y="42" width="160" height="10" rx="5" fill="rgba(15,23,42,.06)"/><rect x="280" y="42" width="129.3" height="10" rx="5" fill="var(--success)"/><text x="512" y="52" font-size="10.5" fill="var(--ink)" text-anchor="end" font-weight="700" font-family="var(--font-mono)">48.5 kg</text><text x="280" y="76" font-size="10.5" fill="var(--muted)" font-family="var(--font-main)">Energy saved</text><rect x="280" y="84" width="160" height="10" rx="5" fill="rgba(15,23,42,.06)"/><rect x="280" y="84" width="125.0" height="10" rx="5" fill="var(--success)"/><text x="512" y="94" font-size="10.5" fill="var(--ink)" text-anchor="end" font-weight="700" font-family="var(--font-mono)">312.4 kWh</text><text x="280" y="118" font-size="10.5" fill="var(--muted)" font-family="var(--font-main)">CO₂e avoided</text><rect x="280" y="126" width="160" height="10" rx="5" fill="rgba(15,23,42,.06)"/><rect x="280" y="126" width="134.7" height="10" rx="5" fill="var(--success)"/><text x="512" y="136" font-size="10.5" fill="var(--ink)" text-anchor="end" font-weight="700" font-family="var(--font-mono)">84.2 kg</text></svg>
