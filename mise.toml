# mise.toml — Kaizen Agent monorepo
# Run `mise install` once, then `mise run dev` to start the full stack.
# https://mise.jdx.dev

# =============================================================================
# Tools
# =============================================================================
[tools]
python   = "3.11"    # backend: FastAPI / ADK agents
node     = "22"      # apps/web + apps/mobile: Vite / React
gcloud   = "580.0.0" # Google Cloud SDK (gcloud & BigQuery bq CLI)
terraform = "1.16.5" # Infrastructure as code (infra/)
firebase = "15.32.1" # Firebase CLI (hosting & emulators)
ruff     = "0.16.10" # PEP 8 fast linter & code formatter (per AGENTS.md)
jq       = "1.8.2"   # JSON query utility for scripts & simulation payloads
rclone   = "1.75.1"  # Google Drive fetch/update CLI (see .agents/skills/google-drive-rclone)
"npm:@google/stitch" = "latest"

# =============================================================================
# Environment
# =============================================================================
[env]
_.python.venv = { path = ".venv", create = true }
VIRTUAL_ENV   = "{{config_root}}/.venv"
PYTHONPATH    = "{{config_root}}"

APP_ENV          = "development"
API_HOST         = "0.0.0.0"
API_PORT         = "8000"
# Frontend ports + Vite proxy target; a shell export (e.g. `WEB_PORT=3010 mise run web`) wins
WEB_PORT         = "{{ get_env(name='WEB_PORT', default='3000') }}"
MOBILE_PORT      = "{{ get_env(name='MOBILE_PORT', default='3001') }}"
FACTORY_PORT     = "{{ get_env(name='FACTORY_PORT', default='3002') }}"
API_PROXY_TARGET = "{{ get_env(name='API_PROXY_TARGET', default='http://localhost:' ~ env.API_PORT) }}"
AI_PROVIDER      = "mock"
# Demo login accounts (prod: TF_VAR_auth_users in mise.local.toml) + token signing key
AUTH_USERS       = '[{"username":"technician","password":"4NpqbcqiOB4v9Ry6","role":"technician","display_name":"Red Panda"},{"username":"shiftleader","password":"REA5Dvx8VjGKdccg","role":"shift_leader","display_name":"Sea Otter"}]'
AUTH_SECRET      = "kaizen-dev-auth-secret-not-for-production"
RCLONE_CONFIG    = "{{config_root}}/.rclone/rclone.conf"
# Prefix of globally unique GCP names: <prefix>-tfstate, -kb (GCS) and -web, -mobile (Hosting)
TF_VAR_global_prefix = "kaizen-lab"

# GOOGLE_APPLICATION_CREDENTIALS = "{{config_root}}/.gcp/credentials.json"

# =============================================================================
# Setup
# =============================================================================

# Install everything — backend pip deps + npm deps of both frontend apps
[tasks.install]
description = "Install all dependencies (backend + apps/web + apps/mobile + simulator/ui)"
depends = ["install:backend", "install:web", "install:mobile", "install:factory"]

[tasks."install:backend"]
description = "Install backend Python dependencies"
run = "uv pip install -r backend/requirements.txt 2>/dev/null || python -m pip install -r backend/requirements.txt"

[tasks."install:web"]
description = "Install apps/web npm dependencies"
dir = "{{config_root}}/apps/web"
run = "npm install"

[tasks."install:mobile"]
description = "Install apps/mobile npm dependencies"
dir = "{{config_root}}/apps/mobile"
run = "npm install"

[tasks."install:factory"]
description = "Install simulator/ui npm dependencies"
dir = "{{config_root}}/simulator/ui"
run = "npm install"

[tasks."mqtt:listen"]
description = "Start the EMQX MQTT telemetry bridge listener"
run = "python -m backend.edge.gateway.mqtt_bridge"

# =============================================================================
# Development
# =============================================================================

# Run the full stack (backend + web + mobile + ADK dev UI) concurrently
# `mise run dev` fans out to all four tasks in parallel
[tasks.dev]
description = "Start the full stack: FastAPI (:8000) + web (:3000) + mobile (:3001) + ADK dev UI (:8001)"
depends  = ["backend", "web", "mobile", "adk-web"]

[tasks.backend]
description = "Start FastAPI dev server with auto-reload (:8000)"
run = "uvicorn backend.api.main:app --host $API_HOST --port $API_PORT --reload"

[tasks.web]
description = "Start Plant Ops dashboard Vite dev server (apps/web, :3000, /api proxied to backend)"
dir = "{{config_root}}/apps/web"
run = "npm run dev -- --port $WEB_PORT --strictPort"

[tasks.mobile]
description = "Start technician mobile app Vite dev server (apps/mobile, :3001, /api + WS proxied to backend)"
dir = "{{config_root}}/apps/mobile"
run = "npm run dev -- --port $MOBILE_PORT --strictPort"

[tasks."factory:dev"]
description = "Start Factory Floor UI Vite dev server (simulator/ui, :3002)"
dir = "{{config_root}}/simulator/ui"
run = "npm run dev -- --port $FACTORY_PORT --strictPort"

[tasks."web:build"]
description = "Typecheck + production build of apps/web (apps/web/dist)"
dir = "{{config_root}}/apps/web"
run = "npm run build"

[tasks."mobile:build"]
description = "Typecheck + production build of apps/mobile (apps/mobile/dist)"
dir = "{{config_root}}/apps/mobile"
run = "npm run build"

[tasks."factory:build"]
description = "Typecheck + production build of simulator/ui (simulator/ui/dist)"
dir = "{{config_root}}/simulator/ui"
run = "npm run build"

[tasks."web:preview"]
description = "Serve the apps/web production build (:3000)"
dir = "{{config_root}}/apps/web"
run = "npm run preview -- --port $WEB_PORT --strictPort"

[tasks."mobile:preview"]
description = "Serve the apps/mobile production build (:3001)"
dir = "{{config_root}}/apps/mobile"
run = "npm run preview -- --port $MOBILE_PORT --strictPort"

[tasks."web:typecheck"]
description = "TypeScript typecheck of apps/web"
dir = "{{config_root}}/apps/web"
run = "npm run typecheck"

[tasks."mobile:typecheck"]
description = "TypeScript typecheck of apps/mobile"
dir = "{{config_root}}/apps/mobile"
run = "npm run typecheck"

[tasks."web:test"]
description = "Run unit tests for apps/web"
dir = "{{config_root}}/apps/web"
run = "npm test"

[tasks."mobile:test"]
description = "Run unit tests for apps/mobile"
dir = "{{config_root}}/apps/mobile"
run = "npm test"

[tasks.build]
description = "Production build of all frontend apps"
depends = ["web:build", "mobile:build"]

[tasks.typecheck]
description = "Typecheck all frontend apps"
depends = ["web:typecheck", "mobile:typecheck"]

[tasks.adk-web]
description = "Start ADK dev UI for the incident workflow (:8001, backend/agents/agent.py)"
run = "adk web backend/agents --port 8001 --reload"

# Production server (no reload)
[tasks.start]
description = "Start FastAPI production server"
run = "uvicorn backend.api.main:app --host $API_HOST --port $API_PORT"

# =============================================================================
# Utilities
# =============================================================================

[tasks.demo]
description = "Inject Scenario 1 (CNC-02 Tool Wear) for deterministic 90-second multi-agent demo"
run = "curl -s -X POST http://localhost:$API_PORT/api/simulation/inject -H \"Authorization: Bearer $(python scripts/dev_token.py)\" -H 'Content-Type: application/json' -d '{\"scenario\":\"cnc_tool_wear\",\"mode\":\"demo\"}' | python -m json.tool"

[tasks."demo:fast"]
description = "Fast-forward injection of Scenario 1 (~8 seconds)"
run = "curl -s -X POST http://localhost:$API_PORT/api/simulation/inject -H \"Authorization: Bearer $(python scripts/dev_token.py)\" -H 'Content-Type: application/json' -d '{\"scenario\":\"cnc_tool_wear\",\"mode\":\"fast\"}' | python -m json.tool"

[tasks."demo:scenario2"]
description = "Inject Scenario 2 (IM-05 Damp Material) for 90-second demo"
run = "curl -s -X POST http://localhost:$API_PORT/api/simulation/inject -H \"Authorization: Bearer $(python scripts/dev_token.py)\" -H 'Content-Type: application/json' -d '{\"scenario\":\"im_damp_material\",\"mode\":\"demo\",\"require_evidence\":true}' | python -m json.tool"

[tasks."demo:scenario2:fast"]
description = "Fast-forward injection of Scenario 2 (~8 seconds)"
run = "curl -s -X POST http://localhost:$API_PORT/api/simulation/inject -H \"Authorization: Bearer $(python scripts/dev_token.py)\" -H 'Content-Type: application/json' -d '{\"scenario\":\"im_damp_material\",\"mode\":\"fast\",\"require_evidence\":true}' | python -m json.tool"

[tasks."sim:reset"]
description = "Reset simulation state, blackboard, and BigQuery buffers to baseline"
run = "curl -s -X POST http://localhost:$API_PORT/api/simulation/reset -H \"Authorization: Bearer $(python scripts/dev_token.py)\" | python -m json.tool"

[tasks."sim:status"]
description = "Get current simulation running status"
run = "curl -s http://localhost:$API_PORT/api/simulation/status -H \"Authorization: Bearer $(python scripts/dev_token.py)\" | python -m json.tool"

[tasks.test]
description = "Run the pytest test suite"
run = "pytest tests/ -v"

[tasks."test:health"]
description = "Verify server health check endpoint (:8000/health)"
run = "curl -f -s http://localhost:$API_PORT/health | jq ."

[tasks.lint]
description = "Run ruff linter on backend, simulator, and test code"
run = "ruff check backend simulator tests"

[tasks.format]
description = "Format code with ruff"
run = "ruff format backend simulator tests"

[tasks.seed]
description = "Seed mock BigQuery / Firestore data"
run = "python scripts/seed_bigquery.py"

[tasks."pr:review"]
description = "Review all open PRs against linked issues, submit verdict, and squash-merge if approved"
run = "python scripts/review_pr.py --all-open"

[tasks."pr:review:dry"]
description = "Dry-run review of open PRs (prints review without submitting or merging)"
run = "python scripts/review_pr.py --all-open --dry-run"

# =============================================================================
# Factory Simulator Service (Edge Telemetry & Conveyor)
# =============================================================================

[tasks.sim]
description = "Start the standalone factory floor & conveyor simulator (1x real-time)"
run = "python -m simulator.main"

[tasks."factory:server"]
description = "Start standalone factory client API server & real-time SSE stream (:8010)"
run = "python -m simulator.server --port 8010"

[tasks."sim:fast"]
description = "Run factory simulator at 5x accelerated speed for testing"
run = "python -m simulator.main --speed 5"

[tasks."sim:dry"]
description = "Run factory simulator in offline dry-run mode (no network MQTT calls)"
run = "python -m simulator.main --dry-run"

[tasks."sim:inject"]
description = "Start factory simulator with CNC-02 mechanical defect pre-injected"
run = "python -m simulator.main --inject"

[tasks."sim:inject:scenario2"]
description = "Start factory simulator with IM-05 damp material defect pre-injected"
run = "python -m simulator.main --inject --scenario im_damp_material"

# Edge Gateway & Gemma Classifier Simulator
[tasks."edge:sim"]
description = "Run Gemma 3 on-prem edge frame classifier & noise filter simulator"
run = "python -m backend.edge.simulator.run_sim --ticks 10"

# =============================================================================
# Docker
# =============================================================================

[tasks."docker:up"]
description = "Start all services via docker compose"
run = "docker compose up --build"

[tasks."docker:down"]
description = "Stop all docker compose services"
run = "docker compose down"

# BigQuery emulator (goccy/bigquery-emulator)
[tasks.emulator]
description = "Start BigQuery emulator container on :9050 (goccy/bigquery-emulator)"
run = "docker compose up -d bigquery-emulator"

[tasks."emulator:down"]
description = "Stop BigQuery emulator container"
run = "docker compose stop bigquery-emulator"

# Pub/Sub emulator (gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators)
[tasks."pubsub:emulator"]
description = "Start Pub/Sub emulator container on :8085"
run = "docker compose up -d pubsub-emulator"

[tasks."pubsub:down"]
description = "Stop Pub/Sub emulator container"
run = "docker compose stop pubsub-emulator"

[tasks."pubsub:bootstrap"]
description = "Bootstrap Pub/Sub topics and subscriptions (telemetry, traceability, quality-events)"
run = "python scripts/bootstrap_pubsub.py"

# Firestore emulator (gcloud beta emulators firestore on :8080)
[tasks."firestore:emulator"]
description = "Start Firestore emulator container on :8080"
run = "docker compose up -d firestore-emulator"

[tasks."firestore:down"]
description = "Stop Firestore emulator container"
run = "docker compose stop firestore-emulator"

# =============================================================================
# Google Drive (rclone) — see .agents/skills/google-drive-rclone/SKILL.md
# Remote name: gdrive. Config lives in .rclone/rclone.conf (gitignored).
# =============================================================================

[tasks."drive:auth"]
description = "One-time interactive Google sign-in: create the 'gdrive' rclone remote"
run = "mkdir -p .rclone && rclone config create gdrive drive scope=drive"

[tasks."drive:ls"]
description = "List a Drive folder: mise run drive:ls <Folder>"
run = 'rclone lsf gdrive:{{arg(name="folder")}} --drive-shared-with-me'

[tasks."drive:stream"]
description = "Stream a remote Drive file to stdout: mise run drive:stream <Path>"
run = 'rclone cat gdrive:{{arg(name="path")}} --drive-shared-with-me'

[tasks."drive:pull"]
description = "Download a Drive folder to local cache (.cache/gdrive/): mise run drive:pull <Folder>"
run = 'rclone copy gdrive:{{arg(name="folder")}} .cache/gdrive/{{arg(name="folder")}} --drive-shared-with-me --drive-export-formats md,csv --progress'

[tasks."drive:sync-kb"]
description = "Sync Google Drive knowledge base to local cache (.cache/gdrive/knowledge_base)"
run = 'rclone copy "gdrive:💻 Competition | AI Builder Cup/knowledge base" .cache/gdrive/knowledge_base --drive-shared-with-me --drive-export-formats md,csv -v'

[tasks."drive:push:dry"]
description = "Preview upload of cached changes (no writes): mise run drive:push:dry <Folder>"
run = 'rclone copy .cache/gdrive/{{arg(name="folder")}} gdrive:{{arg(name="folder")}} --drive-shared-with-me --dry-run -v'

[tasks."drive:push"]
description = "Upload cached changes to a Drive folder (copy only, never deletes): mise run drive:push <Folder>"
run = 'rclone copy .cache/gdrive/{{arg(name="folder")}} gdrive:{{arg(name="folder")}} --drive-shared-with-me -v'

# =============================================================================
# GCP Infrastructure (Terraform, infra/) & Deployment
# Set TF_VAR_project_id (and optionally TF_VAR_billing_account_id) in mise.local.toml.
# Order: infra:bootstrap → infra:init → infra:apply → deploy:backend → infra:seed
#        → kb:import → deploy:frontend (deploy:web + deploy:mobile)
# =============================================================================

[tasks."infra:bootstrap"]
description = "One-time: create the GCS bucket holding Terraform state (infra/bootstrap, local state)"
run = ': "${TF_VAR_project_id:?set TF_VAR_project_id in mise.local.toml}" && terraform -chdir=infra/bootstrap init && terraform -chdir=infra/bootstrap apply'

[tasks."infra:init"]
description = "Initialise the main Terraform stack against the GCS state bucket"
run = ': "${TF_VAR_project_id:?set TF_VAR_project_id in mise.local.toml}" && terraform -chdir=infra/terraform init -backend-config="bucket=${TF_VAR_global_prefix}-tfstate"'

[tasks."infra:plan"]
description = "Preview GCP infrastructure changes (infra/terraform)"
run = ': "${TF_VAR_project_id:?set TF_VAR_project_id in mise.local.toml}" && terraform -chdir=infra/terraform plan'

[tasks."infra:apply"]
description = "Provision / update GCP infrastructure (infra/terraform)"
run = ': "${TF_VAR_project_id:?set TF_VAR_project_id in mise.local.toml}" && terraform -chdir=infra/terraform apply'

[tasks."infra:seed"]
description = "Create BigQuery tables (data/schemas/bigquery_tables.sql) and baseline rows in the real project"
run = ': "${TF_VAR_project_id:?set TF_VAR_project_id in mise.local.toml}" && env -u BIGQUERY_EMULATOR_HOST GCP_PROJECT_ID="$TF_VAR_project_id" BIGQUERY_DATASET="$(terraform -chdir=infra/terraform output -raw bigquery_dataset)" python scripts/seed_bigquery.py'

[tasks."kb:import"]
description = "Upload data/knowledge_base to GCS and import it into the Vertex AI Search datastore"
run = ': "${TF_VAR_project_id:?set TF_VAR_project_id in mise.local.toml}" && python scripts/import_knowledge_base.py --project "$TF_VAR_project_id" --bucket "$(terraform -chdir=infra/terraform output -raw kb_bucket)"'

[tasks."firebase:targets"]
description = "Map firebase.json hosting targets web/mobile/factory to the Terraform-managed sites (.firebaserc)"
run = [
  ': "${TF_VAR_project_id:?set TF_VAR_project_id in mise.local.toml}" && rm -f .firebaserc',
  'firebase target:apply hosting web "$(terraform -chdir=infra/terraform output -json hosting_sites | jq -r .web)" --project "$TF_VAR_project_id"',
  'firebase target:apply hosting mobile "$(terraform -chdir=infra/terraform output -json hosting_sites | jq -r .mobile)" --project "$TF_VAR_project_id"',
  'firebase target:apply hosting factory "$(terraform -chdir=infra/terraform output -json hosting_sites | jq -r .factory)" --project "$TF_VAR_project_id"',
]

[tasks."deploy:web"]
description = "Build apps/web against the Cloud Run stream origin and deploy it to Firebase Hosting (target web)"
depends = ["firebase:targets"]
run = [
  { task = "install:web" },
  'origin="$(terraform -chdir=infra/terraform output -raw service_url)" && cd apps/web && VITE_STREAM_ORIGIN="$origin" npm run build',
  'firebase deploy --only hosting:web --project "$TF_VAR_project_id"',
]

[tasks."deploy:mobile"]
description = "Build apps/mobile against the Cloud Run stream origin and deploy it to Firebase Hosting (target mobile)"
depends = ["firebase:targets"]
run = [
  { task = "install:mobile" },
  'origin="$(terraform -chdir=infra/terraform output -raw service_url)" && cd apps/mobile && VITE_STREAM_ORIGIN="$origin" npm run build',
  'firebase deploy --only hosting:mobile --project "$TF_VAR_project_id"',
]

[tasks."deploy:factory"]
description = "Build simulator/ui against factory origin and deploy it to Firebase Hosting (target factory)"
depends = ["firebase:targets"]
run = [
  { task = "install:factory" },
  'origin="$(terraform -chdir=infra/terraform output -raw factory_service_url 2>/dev/null || terraform -chdir=infra/terraform output -raw service_url)" && cd simulator/ui && VITE_STREAM_ORIGIN="$origin" npm run build',
  'firebase deploy --only hosting:factory --project "$TF_VAR_project_id"',
]

[tasks."deploy:frontend"]
description = "Deploy all frontend apps (apps/web + apps/mobile + simulator/ui) to Firebase Hosting"
depends = ["deploy:web", "deploy:mobile", "deploy:factory"]

[tasks."deploy:backend"]
description = "Build the backend image, push it and roll the Terraform-managed Cloud Run service"
run = "bash scripts/deploy_cloud_run.sh"

[tasks."deploy:backend:dry"]
description = "Dry-run validation of backend container build and Cloud Run deployment"
run = "bash scripts/deploy_cloud_run.sh --dry-run"

[tasks."deploy:factory:container"]
description = "Build the factory container image, push it and roll the Terraform-managed Cloud Run service"
run = "bash scripts/deploy_cloud_run.sh --service-name kaizen-factory --dockerfile simulator/Dockerfile"

[tasks."deploy:factory:container:dry"]
description = "Dry-run validation of factory container build and Cloud Run deployment"
run = "bash scripts/deploy_cloud_run.sh --service-name kaizen-factory --dockerfile simulator/Dockerfile --dry-run"

# =============================================================================
# Remotion Walkthrough Video Tasks
# =============================================================================

[tasks."video:dev"]
description = "Launch Remotion Studio preview (Remotion default :3000; stop `mise run web` first)"
run = "cd video && npm run dev"

[tasks."video:render"]
description = "Render the Technician Copilot 9:16 mobile walkthrough video (MP4)"
run = "cd video && npx remotion render TechnicianCopilotMobile walkthrough_mobile.mp4"

[tasks."video:render-desktop"]
description = "Render the Industrial Command Center 16:9 walkthrough video (MP4)"
run = "cd video && npx remotion render IndustrialCommandCenter walkthrough_desktop.mp4"

