<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" role="img" aria-label="Edge bridge converts OPC-UA machine data into MQTT messages"><style>
:root, svg {
  --ink: #0b1220;
  --ink-2: #1e2638;
  --text: #334155;
  --muted: #64748b;
  --faint: #94a3b8;
  --hair: rgba(15, 23, 42, .07);
  --hair-strong: rgba(15, 23, 42, .14);
  --accent: #5b5bf0;
  --accent-2: #7c6cff;
  --accent-soft: rgba(91, 91, 240, .1);
  --accent-ring: rgba(91, 91, 240, .28);
  --danger: #e5484d;
  --danger-soft: rgba(229, 72, 77, .12);
  --warning: #f5a524;
  --warning-soft: rgba(245, 165, 36, .14);
  --success: #12a150;
  --success-soft: rgba(18, 161, 80, .12);
  --info: #3b82f6;
  --info-soft: rgba(59, 130, 246, .12);
  --font-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}
@keyframes pvScan { 0% { transform: translateY(0); } 100% { transform: translateY(140px); } }
@keyframes pvPacket { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: .9; } 90% { opacity: .9; } 100% { transform: translateX(200px); opacity: 0; } }
@keyframes pvPacketShort { 0% { transform: translateX(0); opacity: 0; } 15% { opacity: .9; } 85% { opacity: .9; } 100% { transform: translateX(118px); opacity: 0; } }
@keyframes pvBlink { 50% { opacity: .25; } }
@keyframes pvBreathe { 50% { opacity: .55; } }
@keyframes pvFlow { to { stroke-dashoffset: -20; } }
.pv-scan { animation: pvScan 3.2s ease-in-out infinite alternate; }
.pv-packet { animation: pvPacket 4.4s linear infinite; }
.pv-packet-short { animation-name: pvPacketShort; animation-duration: 3.6s; }
.pv-blink { animation: pvBlink 2s ease-in-out infinite; }
.pv-breathe { animation: pvBreathe 2.8s ease-in-out infinite; }
.pv-flow { animation: pvFlow 1.6s linear infinite; }
@media (prefers-reduced-motion: reduce) {
  .pv-scan, .pv-packet, .pv-blink, .pv-breathe, .pv-flow { animation: none; }
  .pv-packet { opacity: .9; }
}
</style><defs><marker id="pv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker></defs>
      <rect x="8" y="46" width="140" height="48" rx="8" fill="#f6f8fd" stroke="var(--hair-strong)" stroke-width="1"/><text x="78" y="66" font-size="11" fill="var(--ink)" text-anchor="middle" font-weight="700" font-family="var(--font-main)">OPC-UA</text><text x="78" y="82" font-size="10" fill="var(--muted)" text-anchor="middle" font-family="var(--font-main)">binary · PLC tags</text>
      <path d="M148 70 L188 70" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#pv-arrow)"/>
      <rect x="190" y="52" width="140" height="36" rx="18" fill="var(--accent-soft)" stroke="var(--accent-ring)"/><rect class="pv-packet pv-packet-short" style="animation-delay:0.0s" x="196" y="64" width="18" height="12" rx="3" fill="var(--accent)"/><rect class="pv-packet pv-packet-short" style="animation-delay:-1.2s" x="196" y="64" width="18" height="12" rx="3" fill="var(--accent)"/><rect class="pv-packet pv-packet-short" style="animation-delay:-2.4s" x="196" y="64" width="18" height="12" rx="3" fill="var(--accent)"/>
      <text x="260" y="108" font-size="10.5" fill="var(--muted)" text-anchor="middle" font-family="var(--font-main)">GW-BAY4 · normalise + buffer</text>
      <path d="M330 70 L370 70" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#pv-arrow)"/>
      <rect x="372" y="46" width="140" height="48" rx="8" fill="#fff" stroke="var(--hair-strong)" stroke-width="1"/><text x="442" y="66" font-size="11" fill="var(--ink)" text-anchor="middle" font-weight="700" font-family="var(--font-main)">MQTT</text><text x="442" y="82" font-size="10" fill="var(--muted)" text-anchor="middle" font-family="var(--font-main)">JSON → Pub/Sub</text></svg>
