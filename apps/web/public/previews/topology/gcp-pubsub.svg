      <rect x="400" y="104" width="110" height="40" rx="8" fill="#fff" stroke="var(--hair-strong)" stroke-width="1"/><text x="455" y="129" font-size="11" fill="var(--ink)" text-anchor="middle" font-weight="600" font-family="var(--font-main)">Orchestrator</text>
