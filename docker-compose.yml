# Docker Compose configuration for Kaizen Agent local development dependencies.
# Runs emulators for Google Cloud (BigQuery, Firestore, Pub/Sub) and edge MQTT.
# Application code (backend & frontend) runs natively via `mise run dev -j2`.

services:
  # 1. BigQuery Emulator (Traceability topology & telemetry analytics)
  bigquery-emulator:
    image: ghcr.io/goccy/bigquery-emulator:latest
    container_name: kaizen-bigquery-emulator
    ports:
      - "9050:9050"
    command:
      - "--project=kaizen-local"
      - "--dataset=manufacturing"
      - "--port=9050"
    restart: unless-stopped

  # 2. Firestore Emulator (Blackboard shared reactive state)
  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: kaizen-firestore-emulator
    command: gcloud beta emulators firestore start --host-port=0.0.0.0:8086
    ports:
      - "8086:8086"
    restart: unless-stopped

  # 3. Pub/Sub Emulator (Edge-to-cloud telemetry & anomaly streaming)
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: kaizen-pubsub-emulator
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    restart: unless-stopped

  # 4. Mosquitto MQTT Broker (Industrial edge sensors & machine simulator)
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: kaizen-mqtt-broker
    ports:
      - "1883:1883"
    environment:
      - "ALLOW_ANONYMOUS=true"
    restart: unless-stopped
