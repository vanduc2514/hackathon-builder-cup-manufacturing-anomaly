      <rect x="10" y="104" width="118" height="40" rx="8" fill="#fff" stroke="var(--hair-strong)" stroke-width="1"/><text x="69" y="129" font-size="11" fill="var(--ink)" text-anchor="middle" font-weight="600" font-family="var(--font-main)">Gemma Edge</text>
      <path d="M128 50 C140 50 136 87 148 87" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#pv-arrow)"/><path d="M128 124 C140 124 136 87 148 87" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#pv-arrow)"/>
